name: CI

# Builds Aulix and runs its tests on every push to main and every pull request.
# It no longer publishes to GitHub Pages: the app is deployed with the API (see cerebro/Productos/Aulix/Despliegue.md).
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npx ng test --watch=false

      - name: Production build
        run: npx ng build
