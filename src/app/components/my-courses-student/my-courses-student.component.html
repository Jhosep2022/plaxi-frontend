<div class="course-list-container">
  <!-- Header -->
  <div class="header">
    <h2 class="header-title">Tus Cursos Inscritos</h2>
  </div>

  <!-- Verificar si hay cursos inscritos -->
  @if (courses().length > 0) {
    <div>
      <!-- Lista de Cursos -->
      @for (course of courses(); track course.idInscripcion) {
        <div class="course-card">
          <div class="course-info">
            <img [src]="course.image" alt="{{ course.name }} image" class="course-image" />
            <div class="course-details">
              <h3 class="course-title">{{ course.name }}</h3>
              <p class="course-date">{{ course.date | date: 'dd/MM/yyyy' }} | {{ course.time }}</p>
              <p class="course-enrollment">Disfruta el curso con nosotros</p>
            </div>
          </div>
          <div class="button-container">
            <!-- Botón para abrir el curso -->
            <button class="open-btn" (click)="openCourse(course)">Abrir</button>
            <!-- Botón para eliminar inscripción -->
            <button class="delete-btn" (click)="deleteCourse(course.idInscripcion)">Darse de Baja</button>
          </div>
        </div>
      }
    </div>
  } @else {
    <div class="empty-state">
      <p>No tienes cursos inscritos.</p>
      <button mat-raised-button color="primary" [routerLink]="session.rutaRol('catalogo')">Explora Cursos</button>
    </div>
  }

  <!-- Mensaje cuando no hay cursos inscritos -->
</div>
